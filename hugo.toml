theme = "hugo-blog-awesome"
title = "Awesome Hugo blog"
baseURL = 'https://hba.sid.one/'

# This is what goes in <html lang="">
locale = 'en-us'

# This defines how dates are formatted
defaultContentLanguage = "en-gb"

# Enable emojis globally
enableEmoji = true
ignoreErrors = ["additional-script-loading-error"] # ignore error of loading additional scripts.

[services]
  [services.googleAnalytics]
    id = '' # G-MEASUREMENT_ID
  [services.disqus]
    shortname = ''

# set markup.highlight.noClasses=false to enable code highlight
[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2 # ToC starts from H2
    endLevel = 4 # ToC ends at H4
    ordered = false # generates <ul> instead of <ol>

############################## English language ################################
[Languages.en-gb]
  label = "English"
  locale = "en-gb"
  contentDir = "content/en"
  weight = 1

  [Languages.en-gb.menu]
  [[Languages.en-gb.menu.main]]
    pageRef="/"
    name = 'Home'
    url = '/'
    weight = 10
  [[Languages.en-gb.menu.main]]
    pageRef="projects"
    name = 'Projects'
    url = '/projects/'
    weight = 20
  [[Languages.en-gb.menu.main]]
    pageRef="about"
    name = 'About'
    url = '/about/'
    weight = 30

[Languages.en-gb.params]
  sitename = "Awesome hugo blog"
  defaultColor = "dark" # set color mode: dark, light, auto
  description = "Minimal Hugo blog theme with light and dark mode support"
    mainSections = ['projects']
  toc = true # set to false to disable table of contents 'globally'
  tocOpen = false # set to true to open table of contents by default
  goToTop = true # set to false to disable 'go to top' button
  additionalScripts = ['js/custom.js', 'js/custom-2.js']
  dateFormat = "" # empty = "2 Jan 2006" format
  rssFeedDescription = "summary" # summary or full

[Languages.en-gb.params.author]
  avatar = "cat.jpg" # put the file in assets folder; image must be square
  intro = "Marina Kapula"
  name = "Maryna Kapula"
  description = "I build websites and forms that are easy to use."

# Allow to override webmanifest options
[Languages.en-gb.params.webmanifest]
  name = "sitename"
  short_name = "sitename"
  start_url = "/"
  theme_color = "#434648"
  background_color = "#fff"
  display = "standalone"

###################################################################

# Allow to override `browserconfig.xml` params (configuration for windows embedded browsers)
[params.browserconfig]
  TileColor = "#2d89ef"

[[params.socialIcons]]
name = "github"
url = "https://github.com/hugo-sid"

[[params.socialIcons]]
name = "twitter"
url = "https://twitter.com"

[[params.socialIcons]]
name = "Rss"
url = "/index.xml"