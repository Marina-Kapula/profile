# Builds the site with Hugo and publishes it to GitHub Pages
# every time something is pushed to the main branch.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows running it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo (extended, needed for Sass)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.170.0"
          extended: true

      - name: Install Dart Sass (turns .scss styles into CSS)
        run: sudo snap install dart-sass

      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the site
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --cleanDestinationDir --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
