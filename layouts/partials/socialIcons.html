{{/* Same as the theme, but email links open the mail app, not an empty new tab */}}
{{- range . }}
{{- $url := trim .url " " }}
<a href="{{ $url }}"{{ if not (hasPrefix $url "mailto:") }} target="_blank" rel="noopener noreferrer me"{{ end }}
    title="{{ (.title | default .name) | title }}">
    {{ partial "svgs/svgs.html" . }}
</a>
{{- end }}
