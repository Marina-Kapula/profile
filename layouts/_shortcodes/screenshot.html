{{/*
  A screenshot with a caption. Put the picture in static/images/ and write in a project page:
  {{< screenshot src="images/amfi-login.png" caption="Login page" >}}
  Click on the picture opens it full size.
*/}}
{{ $src := .Get "src" | relURL }}
{{ $caption := .Get "caption" }}
<figure class="screenshot">
    <a href="{{ $src }}" target="_blank" rel="noopener">
        <img src="{{ $src }}" alt="{{ $caption | default "Screenshot" }}" loading="lazy">
    </a>
    {{ with $caption }}<figcaption>{{ . | markdownify }}</figcaption>{{ end }}
</figure>
